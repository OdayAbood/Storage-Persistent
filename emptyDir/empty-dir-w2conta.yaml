# This is a Kubernetes Pod manifest file that demonstrates the use of an emptyDir volume.
# Here we are definging tow containers in a single pod, one for writing to the emptyDir volume and another for reading from it.
apiVersion: v1
kind: Pod
metadata: 
  name: empty-dir-4learning-w2conta
  labels:
    name: empty-dir-4learning
spec:
  containers:
  - name: empty-dir-4learning-writer
    image: busybox:1.36.1
    # This is for specifying the command to be executed when the container starts.
    command: 
      - sh 
      - -c 
      - 'sleep 3600'
    resources:
      limits:
        memory: '128Mi'
        cpu: '500m'
    volumeMounts:
    - name: temp-storage
      mountPath: /temp-storage/container1
  - name: empty-dir-4learning-reader
    image: busybox:1.36.1
    # This is for specifying the command to be executed when the container starts.
    command: 
      - sh 
      - -c 
      - 'sleep 3600'
    resources:
      limits:
        memory: '128Mi'
        cpu: '500m'
    volumeMounts:
    - name: temp-storage
      mountPath: /temp-storage/container2
      readOnly: true
  volumes:
  - name: temp-storage
    emptyDir: {}
# kubectl exec -it empty-dir-4learning-w2conta -c empty-dir-4learning-reader -- sh
# This command will open a shell in the reader container of the pod. You can then navigate to the /temp-storage/container2 directory and check for the presence of the hello.txt file created by the writer container.
